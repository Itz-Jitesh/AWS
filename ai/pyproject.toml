[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planproof-ai"
version = "0.1.0"
description = "PlanProof Agent C — LLM adapter, requirements extraction, patch generation, bounded repair loop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
include = ["planproof_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
